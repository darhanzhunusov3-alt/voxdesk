# Сборка iOS-приложения VoxDesk (Capacitor) на macOS-машине GitHub — локальный Mac не нужен.
# Результат — неподписанный VoxDesk-unsigned.ipa во вкладке Actions → запуск → Artifacts.
# Подпись при установке: Sideloadly / AltStore с бесплатным Apple ID (они переподписывают .ipa своим сертификатом).
name: Build iOS

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'build.py'
      - 'ios/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # build.py вызывается как `python` (npm run sync) — даём его явно
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Зависимости
        run: npm ci

      - name: Сборка студии и синхронизация с платформами
        run: npm run sync

      - name: Версия Xcode и схемы проекта
        run: |
          xcodebuild -version
          xcodebuild -list -project ios/App/App.xcodeproj

      - name: Пакеты Swift (Capacitor)
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

      - name: Сборка для iPhone без подписи
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build -quiet \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/xcodebuild.log
          test -d build/DerivedData/Build/Products/Release-iphoneos/App.app

      - name: Упаковка в .ipa
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/App.app build/ipa/Payload/
          cd build/ipa && zip -qry ../VoxDesk-unsigned.ipa Payload
          ls -lh ../VoxDesk-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: VoxDesk-ios-unsigned
          path: build/VoxDesk-unsigned.ipa
          retention-days: 14

      - name: Лог xcodebuild при ошибке
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
